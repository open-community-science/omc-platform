# Relay location block — included inline in /etc/nginx/sites-available/omc-platform
# (microbial.opencommunity.science)
#
# This is a reference copy. The live config is managed by deploy.sh
# and includes this block alongside the /staging/ and / locations.

location /relay/ {
    proxy_pass http://127.0.0.1:8484/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
