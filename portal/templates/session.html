{% extends "base.html" %}

{% block title %}Research Session — {{ slug }} - OMC{% endblock %}

{% block content %}
<style>
    .main-content { padding: 0 !important; display: flex; flex-direction: column; flex: 1; }
    .session-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 16px; background: #1a1a2e; color: #e0e0e0;
        font-family: system-ui, sans-serif; font-size: 14px;
    }
    .session-header .brand { font-weight: 600; }
    .session-header .brand a { color: #e0e0e0; text-decoration: none; }
    .session-header .brand a:hover { text-decoration: underline; }
    .session-header .controls { display: flex; gap: 8px; }
    .session-header button {
        padding: 4px 12px; border-radius: 4px; border: 1px solid #444;
        background: #2a2a3e; color: #e0e0e0; cursor: pointer; font-size: 13px;
    }
    .session-header button:hover { background: #3a3a5e; }
    .session-header .tab-active { background: #4a4aae; border-color: #6a6ade; }
    .session-content { flex: 1; display: flex; min-height: 0; }
    .panel { flex: 1; border: none; }
    .panel-hidden { display: none; }
    .split-view .panel { width: 50%; }
</style>

<div class="session-header">
    <span class="brand"><a href="/submissions/{{ slug }}">{{ slug }}</a> — Research Session</span>
    <div class="controls">
        <button id="btn-chat" class="tab-active" onclick="showPanel('chat')">Chat</button>
        <button id="btn-notebook" onclick="showPanel('notebook')">Data Explorer</button>
        <button id="btn-split" onclick="showPanel('split')">Split View</button>
        <button onclick="stopSession()">Save &amp; Close</button>
    </div>
</div>
<div class="session-content" id="content">
    <div id="loading" style="display:flex; align-items:center; justify-content:center; flex:1; color:#aaa; font-family:system-ui;">
        Starting research environment...
    </div>
    <iframe id="frame-chat" class="panel" style="display:none"></iframe>
    <iframe id="frame-notebook" class="panel panel-hidden" style="display:none"></iframe>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Wait for container to be ready before loading iframes
    (async function waitForReady() {
        const chatUrl = '/session-proxy/{{ chat_port }}/';
        const nbUrl = '/session-proxy/{{ notebook_port }}/';
        const loading = document.getElementById('loading');
        const chat = document.getElementById('frame-chat');
        const nb = document.getElementById('frame-notebook');

        for (let i = 0; i < 30; i++) {
            try {
                const r = await fetch(chatUrl, { method: 'HEAD' });
                if (r.ok) {
                    loading.style.display = 'none';
                    chat.src = chatUrl;
                    nb.src = nbUrl;
                    chat.style.display = '';
                    nb.style.display = '';
                    return;
                }
            } catch (e) {}
            loading.textContent = 'Starting research environment' + '.'.repeat((i % 3) + 1);
            await new Promise(r => setTimeout(r, 2000));
        }
        loading.textContent = 'Session failed to start. Please go back and try again.';
    })();

    function showPanel(mode) {
        const chat = document.getElementById('frame-chat');
        const nb = document.getElementById('frame-notebook');
        const content = document.getElementById('content');
        const btnChat = document.getElementById('btn-chat');
        const btnNb = document.getElementById('btn-notebook');
        const btnSplit = document.getElementById('btn-split');

        content.classList.remove('split-view');
        [btnChat, btnNb, btnSplit].forEach(b => b.classList.remove('tab-active'));

        if (mode === 'chat') {
            chat.classList.remove('panel-hidden');
            nb.classList.add('panel-hidden');
            btnChat.classList.add('tab-active');
        } else if (mode === 'notebook') {
            chat.classList.add('panel-hidden');
            nb.classList.remove('panel-hidden');
            btnNb.classList.add('tab-active');
        } else {
            chat.classList.remove('panel-hidden');
            nb.classList.remove('panel-hidden');
            content.classList.add('split-view');
            btnSplit.classList.add('tab-active');
        }
    }

    async function stopSession() {
        if (!confirm('Save and close this session? You can resume it later.')) return;
        await fetch('/sessions/{{ slug }}/stop', { method: 'POST', credentials: 'same-origin' });
        window.location.href = '/submissions/{{ slug }}';
    }
</script>
{% endblock %}
